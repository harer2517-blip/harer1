  <script>
    // كود JavaScript مبسط
    $(document).ready(function() {
      // تفعيل الكاروسيل
      $('.carousel').carousel();
      
      // إصلاح الروابط
      $('#tukaLink').attr('href', 'tukacatagory.html');
      
      // إخفاء شاشة التحميل لو كانت موجودة
      $('.page-loader').hide();
      
      // زر العودة للأعلى
      $('.scroll-up a').click(function(e) {
        e.preventDefault();
        $('html, body').animate({scrollTop: 0}, 500);
      });
      
      // إظهار/إخفاء زر العودة للأعلى
      $(window).scroll(function() {
        if ($(this).scrollTop() > 200) {
          $('.scroll-up').fadeIn();
        } else {
          $('.scroll-up').fadeOut();
        }
      });
    });
  </script>
